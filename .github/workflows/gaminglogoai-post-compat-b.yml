name: GamingLogoAI POST compatibility B
on:
  push:
    branches:
      - experiment/gaminglogoai-post-body-b

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact pushed commit
        uses: actions/checkout@v4
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify immutable baseline ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 0f11fb40f72cef5b0e3c13982fbebf5259a642fd "$GITHUB_SHA"

      - name: Install baseline dependencies
        run: npm ci --include=dev

      - name: Isolate newer Wrangler runtime
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund wrangler@4.164.0

      - name: Build GamingLogoAI OpenNext
        env:
          NODE_ENV: production
          NEXTAUTH_URL: https://fixture.invalid
          HOST_NAME: https://fixture.invalid
          DB_AUTH_BACKEND: service
          DB_READS_BACKEND: service
          AUTH_EXTERNAL_SYNC_MODE: disabled
          MOCK_REPLICATE: "true"
        run: |
          npm run build
          npx opennextjs-cloudflare build --dangerouslyUseUnsupportedNextVersion

      - name: Minimal Pages Router POST control
        env:
          COMPAT_NEXT_VERSION: "14.2.15"
          COMPAT_OPENNEXT_VERSION: "1.14.0"
          COMPAT_WRANGLER_VERSION: "4.164.0"
        run: node scripts/next-post-compat-control.mjs

      - name: GamingLogoAI compiled HTTP probe
        env:
          GENERATION_HTTP_FIXTURE_ROOT: "${{ github.workspace }}/.open-next"
        run: node scripts/generation-http-runtime-smoke.mjs

