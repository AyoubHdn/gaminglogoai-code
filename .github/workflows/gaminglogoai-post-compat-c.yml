name: GamingLogoAI POST compatibility C
on:
  push:
    branches:
      - experiment/gaminglogoai-post-body-c

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact pushed commit
        uses: actions/checkout@v4
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify immutable candidate ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 0f11fb40f72cef5b0e3c13982fbebf5259a642fd "$GITHUB_SHA"

      - name: Resolve exact candidate lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --save-exact --no-audit --no-fund
          sha256sum package-lock.json | tee .ci-compat-lock-sha.txt
          npm ci --include=dev

      - name: Verify supported candidate versions
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'require("./node_modules/next/package.json").version')" = "15.5.29"
          test "$(node -p 'require("./node_modules/@opennextjs/cloudflare/package.json").version')" = "1.20.17"
          test "$(node -p 'require("./node_modules/wrangler/package.json").version')" = "4.148.0"

      - name: Build supported OpenNext candidate
        env:
          NODE_ENV: production
          NEXTAUTH_URL: https://fixture.invalid
          HOST_NAME: https://fixture.invalid
          DB_AUTH_BACKEND: service
          DB_READS_BACKEND: service
          AUTH_EXTERNAL_SYNC_MODE: disabled
          MOCK_REPLICATE: "true"
        run: |
          npm run build
          npx opennextjs-cloudflare build

      - name: Minimal Pages Router POST control
        env:
          COMPAT_NEXT_VERSION: "15.5.29"
          COMPAT_OPENNEXT_VERSION: "1.20.17"
          COMPAT_WRANGLER_VERSION: "4.148.0"
        run: node scripts/next-post-compat-control.mjs

      - name: GamingLogoAI compiled HTTP probe
        env:
          GENERATION_HTTP_FIXTURE_ROOT: "${{ github.workspace }}/.open-next"
        run: node scripts/generation-http-runtime-smoke.mjs

      - name: Preserve candidate lockfile evidence
        uses: actions/upload-artifact@v4
        with:
          name: gaminglogoai-compat-c-lock-${{ github.sha }}
          path: |
            package-lock.json
            .ci-compat-lock-sha.txt
