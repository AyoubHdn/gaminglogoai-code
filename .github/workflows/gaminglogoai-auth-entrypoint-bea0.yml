name: GamingLogoAI auth entrypoint

on:
  push:
    branches:
      - staging/gaminglogoai-auth-entrypoint-bea0
      - experiment/gaminglogoai-post-body-c

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: gaminglogoai_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d gaminglogoai_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/gaminglogoai_ci
      GAMING_DB_SERVICE_TEST_DATABASE_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/gaminglogoai_ci
      NODE_ENV: test
      DB_AUTH_BACKEND: prisma
      DB_READS_BACKEND: prisma
      CLOUDFLARE_READ_ONLY_MODE: "false"
      AUTH_EXTERNAL_SYNC_MODE: enabled
      NEXTAUTH_SECRET: ci-nextauth-secret
      NEXTAUTH_URL: http://127.0.0.1:3000
      GOOGLE_CLIENT_ID: ci-google-client
      GOOGLE_CLIENT_SECRET: ci-google-secret
      REPLICATE_API_TOKEN: ci-replicate-token
      MOCK_REPLICATE: "true"
      SECRET_ACCESS_KEY: ci-secret
      ACCESS_KEY_ID: ci-access-key
      STRIPE_SECRET_KEY: sk_test_ci
      HOST_NAME: http://127.0.0.1:3000
      STRIPE_WEB_HOOK_SECRET: whsec_ci
      PRICE_ID_STARTER: price_ci_starter
      PRICE_ID_PRO: price_ci_pro
      PRICE_ID_ELITE: price_ci_elite
      MAUTIC_BASE_URL: http://127.0.0.1:9
      MAUTIC_USERNAME: ci-mautic
      MAUTIC_PASSWORD: ci-mautic-password
      CRON_SECRET: ci-cron-secret
      MYLEAD_SECURITY_KEY: ci-mylead-key
      IPAPI_KEY: ci-ipapi-key
      NEXT_PUBLIC_STRIPE_KEY: pk_test_ci
      NEXT_PUBLIC_AWS_REGION_GAMING: us-east-1
      NEXT_PUBLIC_S3_BUCKET_NAME_GAMING: gaminglogoai-ci
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify immutable checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "staging/gaminglogoai-auth-entrypoint-bea0"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git status --porcelain)" = ""

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --include=dev

      - name: Generate pinned Prisma client
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Validate disposable database target
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          for (const name of ["DATABASE_URL", "GAMING_DB_SERVICE_TEST_DATABASE_URL"]) {
            const value = process.env[name];
            if (!value) throw new Error(`${name} is missing`);
            const url = new URL(value);
            if (url.protocol !== "postgresql:" || url.hostname !== "127.0.0.1" ||
                url.port !== "5432" || url.pathname !== "/gaminglogoai_ci" ||
                url.search || url.hash) {
              throw new Error(`${name} is not the dedicated localhost database`);
            }
          }
          NODE
          migration_count="$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d | wc -l)"
          test "$migration_count" = "25"

      - name: Apply only the pinned local migration history
        run: npx prisma migrate deploy --schema prisma/schema.prisma

      - name: Install Worker postgres dependency without manifest changes
        working-directory: workers/db
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund

      - name: Install application integration-test postgres dependency
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund postgres@3.4.7

      - name: Entrypoint and session tests
        run: >-
          node --experimental-strip-types --test --test-concurrency=1
          src/server/__tests__/requestAuth.test.ts
          src/server/__tests__/requestDbService.test.ts
          src/server/__tests__/authOptionsFactory.test.ts
          workers/db/src/auth.remote.integration.test.ts

      - name: Existing auth and DB PostgreSQL integration tests
        run: >-
          node --experimental-strip-types --test --test-concurrency=1
          src/server/__tests__/dbService.integration.test.ts
          src/server/__tests__/dbService.remote.test.ts
          workers/db/src/index.test.ts
          workers/db/src/remote.integration.test.ts

      - name: Generation ledger and orchestration integration tests
        run: >-
          node --experimental-strip-types --test --test-concurrency=1
          src/server/__tests__/generation.test.ts
          workers/db/src/generation.remote.integration.test.ts

      - name: Protected generation procedure integration tests
        env:
          AUTH_EXTERNAL_SYNC_MODE: disabled
        run: >-
          node --experimental-strip-types
          --experimental-loader ./scripts/resolve-src-alias-loader.mjs
          --test --test-concurrency=1
          src/server/__tests__/generate.procedure.integration.test.ts

      - name: Runtime harness and artifact fixture tests
        run: >-
          node --test
          scripts/workers-runtime-smoke.test.mjs
          scripts/package-staging-fixture.test.mjs
          scripts/package-staging-auth.test.mjs
          workers/staging-auth/profile.test.mjs

      - name: Application typecheck
        run: npx tsc --noEmit --allowImportingTsExtensions

      - name: DB Worker typecheck
        run: npx tsc --project workers/db/tsconfig.json

      - name: Focused lint
        run: >-
          npx eslint
          --parser-options '{"project":["tsconfig.json","workers/db/tsconfig.json"]}'
          src/env.mjs
          src/pages/api/auth/[...nextauth].ts
          src/pages/api/trpc/[trpc].ts
          src/pages/api/cpa/unlock.ts
          src/pages/api/cpa/cpx/unlock.ts
          src/pages/api/cpa/cpx/result.ts
          src/server/generation/contract.ts
          src/server/generation/sqlService.ts
          src/server/generation/dbService.ts
          src/server/generation/requestService.ts
          src/server/generation/runLogo.ts
          src/server/__tests__/generation.test.ts
          src/server/__tests__/generate.procedure.integration.test.ts
          workers/db/src/generation.remote.integration.test.ts
          src/server/auth.ts
          src/server/authRuntime.ts
          src/server/requestAuth.ts
          src/server/requestDbService.ts
          src/server/watermarkPolicy.ts
          src/server/authDbService.ts
          src/server/authOptionsFactory.ts
          src/server/remoteNextAuthAdapter.ts
          src/server/api/trpc.ts
          src/server/api/readRoot.ts
          src/server/api/routers/user.ts
          src/server/__tests__/requestAuth.test.ts
          src/server/__tests__/requestDbService.test.ts
          src/server/__tests__/authOptionsFactory.test.ts
          workers/db/src/index.ts
          workers/db/src/auth.ts
          workers/db/src/auth.remote.integration.test.ts

      - name: Next.js production build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify conditional worker dependency traces
        run: |
          node --test scripts/check-worker-dependency-traces.test.mjs
          node scripts/check-worker-dependency-traces.mjs

      - name: Build OpenNext Cloudflare application
        id: opennext-build
        run: npx opennextjs-cloudflare build --dangerouslyUseUnsupportedNextVersion
        env:
          NODE_ENV: production
          DB_AUTH_BACKEND: service
          DB_READS_BACKEND: service
          CLOUDFLARE_READ_ONLY_MODE: "true"
          AUTH_EXTERNAL_SYNC_MODE: disabled
          NEXTAUTH_URL: https://gaminglogoai-cloudflare-staging.hdnstudio.workers.dev
          HOST_NAME: https://gaminglogoai-cloudflare-staging.hdnstudio.workers.dev

      - name: Verify OpenNext bundle layout
        shell: bash
        run: |
          test -s .open-next/worker.js
          test -d .open-next/assets
          test -d .open-next/server-functions
          echo "OpenNext/Cloudflare application packaging: VERIFIED"

      - name: Root Worker Wrangler dry-run
        id: root-dry-run
        run: npx wrangler@4.148.0 deploy --config wrangler.jsonc --dry-run --outdir .ci-runtime/bundle

      - name: DB Worker Wrangler dry-run
        run: npx wrangler@4.148.0 deploy --config workers/db/wrangler.jsonc --dry-run

      - name: Local Workers runtime startup and auth smoke test
        id: runtime-smoke
        timeout-minutes: 5
        run: node scripts/workers-runtime-smoke.mjs

      - name: Prepare fixture artifact provenance and content hashes
        id: fixture-package
        if: always() && steps.opennext-build.outcome == 'success' && steps.root-dry-run.outcome == 'success'
        run: node scripts/package-staging-fixture.mjs

      - name: Preserve fixture-only OpenNext artifact
        if: always() && steps.fixture-package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gaminglogoai-open-next-staging-fixture-${{ github.sha }}
          path: .open-next/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Preserve read-only bundle for auth candidate packaging
        if: steps.fixture-package.outcome == 'success'
        shell: bash
        run: cp -a .open-next .ci-readonly-open-next

      - name: Build separate generation HTTP fixture bundle
        if: steps.fixture-package.outcome == 'success'
        run: |
          rm -rf .next .open-next .ci-generation-open-next .ci-generation-runtime
          npm run build
          npx opennextjs-cloudflare build --dangerouslyUseUnsupportedNextVersion
          mv .open-next .ci-generation-open-next
        env:
          NODE_ENV: production
          DB_AUTH_BACKEND: service
          DB_READS_BACKEND: service
          DB_GENERATION_BACKEND: service
          CLOUDFLARE_READ_ONLY_MODE: "false"
          AUTH_EXTERNAL_SYNC_MODE: disabled
          NEXTAUTH_URL: https://gaminglogoai-generation.fixture.invalid
          HOST_NAME: https://gaminglogoai-generation.fixture.invalid

      - name: Generation fixture Wrangler dry-run
        if: steps.fixture-package.outcome == 'success'
        shell: bash
        run: |
          cp -a .ci-generation-open-next .open-next
          npx wrangler@4.148.0 deploy --config wrangler.gaminglogoai-generation-fixture.jsonc --dry-run --outdir .ci-generation-runtime/bundle
          rm -rf .open-next

      - name: Compiled OpenNext HTTP generation probe
        if: steps.fixture-package.outcome == 'success'
        timeout-minutes: 5
        env:
          GENERATION_HTTP_FIXTURE_ROOT: ${{ github.workspace }}/.ci-generation-open-next
        run: node scripts/generation-http-runtime-smoke.mjs

      - name: Package fixture-only generation bundle
        if: steps.fixture-package.outcome == 'success'
        shell: bash
        run: |
          cp -a .ci-generation-open-next .ci-generation-artifact
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = '.ci-generation-artifact';
          const report = JSON.parse(fs.readFileSync('.ci-generation-runtime/runtime-smoke-report.json', 'utf8'));
          if (report.result !== 'GAMINGLOGOAI_GENERATION_HTTP_PROBE_PASS' || report.fixtureOnly !== true || report.deployable !== false) throw new Error('Generation fixture report is not a passing non-deployable fixture');
          const provenance = {
            schemaVersion: 1,
            purpose: 'compiled-generation-http-runtime-fixture',
            fixtureOnly: true,
            deployable: false,
            applicationSha: process.env.GITHUB_SHA,
            workflowSha: process.env.GITHUB_SHA,
            ciRunId: process.env.GITHUB_RUN_ID,
            runtimeSmokeResult: report.result,
            workerdVersion: report.workerdVersion,
            miniflareVersion: report.miniflareVersion,
            runtimeCompatibilityDate: report.runtimeCompatibilityDate,
          };
          fs.writeFileSync(path.join(root, 'build-provenance.json'), `${JSON.stringify(provenance, null, 2)}\n`, 'utf8');
          fs.copyFileSync('.ci-generation-runtime/runtime-smoke-report.json', path.join(root, 'runtime-smoke-report.json'));
          NODE

      - name: Preserve fixture-only generation bundle
        if: steps.fixture-package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gaminglogoai-open-next-generation-http-fixture-${{ github.sha }}
          path: .ci-generation-artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Restore read-only bundle for auth candidate packaging
        if: steps.fixture-package.outcome == 'success'
        shell: bash
        run: mv .ci-readonly-open-next .open-next

      - name: Prepare the auth-only staging candidate
        run: node scripts/package-staging-auth.mjs prepare

      - name: Auth-only Worker Wrangler dry-run
        run: npx wrangler@4.148.0 deploy --config wrangler.auth-staging.jsonc --dry-run --outdir .ci-auth-runtime/bundle

      - name: Actual workerd Google OAuth fixture round trip
        timeout-minutes: 5
        run: node scripts/staging-auth-runtime-smoke.mjs

      - name: Verify auth candidate provenance and complete content manifest
        run: node scripts/package-staging-auth.mjs finalize

      - name: Preserve the auth-only staging candidate
        uses: actions/upload-artifact@v4
        with:
          name: gaminglogoai-staging-google-auth-candidate-${{ github.sha }}
          path: .staging-auth/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Diff check
        run: git diff --check



  compatibility-experiment:
    if: github.ref_name == 'experiment/gaminglogoai-post-body-c'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify immutable baseline ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 0f11fb40f72cef5b0e3c13982fbebf5259a642fd "$GITHUB_SHA"

      - name: Resolve exact candidate lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --save-exact --no-audit --no-fund
          sha256sum package-lock.json | tee .ci-compat-lock-sha.txt
      - name: Install candidate dependencies
        run: npm ci --include=dev


      - name: Install compatibility test database driver
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund postgres@3.4.7

      - name: Build GamingLogoAI OpenNext
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://invalid:invalid@db.invalid:5432/invalid
          DB_AUTH_BACKEND: service
          DB_READS_BACKEND: service
          DB_GENERATION_BACKEND: service
          CLOUDFLARE_READ_ONLY_MODE: "true"
          AUTH_EXTERNAL_SYNC_MODE: disabled
          NEXTAUTH_SECRET: fixture-nextauth-secret
          NEXTAUTH_URL: https://fixture.invalid
          HOST_NAME: https://fixture.invalid
          GOOGLE_CLIENT_ID: fixture-google-client
          GOOGLE_CLIENT_SECRET: fixture-google-secret
          REPLICATE_API_TOKEN: fixture-replicate-token
          MOCK_REPLICATE: "true"
          SECRET_ACCESS_KEY: fixture-secret-key
          ACCESS_KEY_ID: fixture-access-key
          STRIPE_SECRET_KEY: sk_test_fixture
          STRIPE_WEB_HOOK_SECRET: whsec_fixture
          PRICE_ID_STARTER: price_fixture_starter
          PRICE_ID_PRO: price_fixture_pro
          PRICE_ID_ELITE: price_fixture_elite
          MAUTIC_BASE_URL: http://127.0.0.1:9
          MAUTIC_USERNAME: fixture-mautic
          MAUTIC_PASSWORD: fixture-mautic-password
          CRON_SECRET: fixture-cron-secret
          MYLEAD_SECURITY_KEY: fixture-mylead-key
          IPAPI_KEY: fixture-ipapi-key
          NEXT_PUBLIC_STRIPE_KEY: pk_test_fixture
          NEXT_PUBLIC_AWS_REGION_GAMING: us-east-1
          NEXT_PUBLIC_S3_BUCKET_NAME_GAMING: gaminglogoai-fixture
        run: |
          npm run build
          npx opennextjs-cloudflare build

      - name: Minimal Pages Router POST control
        env:
          COMPAT_NEXT_VERSION: "15.5.29"
          COMPAT_OPENNEXT_VERSION: "1.20.17"
          COMPAT_WRANGLER_VERSION: "4.148.0"
        run: node scripts/next-post-compat-control.mjs

      - name: GamingLogoAI compiled HTTP probe
        env:
          GENERATION_HTTP_FIXTURE_ROOT: ${{ github.workspace }}/.open-next
        run: node scripts/generation-http-runtime-smoke.mjs
