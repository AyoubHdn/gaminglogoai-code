name: GamingLogoAI auth entrypoint

on:
  push:
    branches:
      - staging/gaminglogoai-auth-entrypoint-bea0
      - staging/gaminglogoai-executor-prefix-4de
      - experiment/gaminglogoai-post-body-c
      - experiment/gaminglogoai-post-body-c-generated-runtime

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: gaminglogoai_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d gaminglogoai_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/gaminglogoai_ci
      GAMING_DB_SERVICE_TEST_DATABASE_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/gaminglogoai_ci
      NODE_ENV: test
      DB_AUTH_BACKEND: prisma
      DB_READS_BACKEND: prisma
      CLOUDFLARE_READ_ONLY_MODE: "false"
      AUTH_EXTERNAL_SYNC_MODE: enabled
      NEXTAUTH_SECRET: ci-nextauth-secret
      NEXTAUTH_URL: http://127.0.0.1:3000
      GOOGLE_CLIENT_ID: ci-google-client
      GOOGLE_CLIENT_SECRET: ci-google-secret
      REPLICATE_API_TOKEN: ci-replicate-token
      MOCK_REPLICATE: "true"
      SECRET_ACCESS_KEY: ci-secret
      ACCESS_KEY_ID: ci-access-key
      STRIPE_SECRET_KEY: sk_test_ci
      HOST_NAME: http://127.0.0.1:3000
      STRIPE_WEB_HOOK_SECRET: whsec_ci
      PRICE_ID_STARTER: price_ci_starter
      PRICE_ID_PRO: price_ci_pro
      PRICE_ID_ELITE: price_ci_elite
      MAUTIC_BASE_URL: http://127.0.0.1:9
      MAUTIC_USERNAME: ci-mautic
      MAUTIC_PASSWORD: ci-mautic-password
      CRON_SECRET: ci-cron-secret
      MYLEAD_SECURITY_KEY: ci-mylead-key
      IPAPI_KEY: ci-ipapi-key
      NEXT_PUBLIC_STRIPE_KEY: pk_test_ci
      NEXT_PUBLIC_AWS_REGION_GAMING: us-east-1
      NEXT_PUBLIC_S3_BUCKET_NAME_GAMING: gaminglogoai-ci
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify immutable checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "staging/gaminglogoai-auth-entrypoint-bea0" || test "$GITHUB_REF_NAME" = "staging/gaminglogoai-executor-prefix-4de" || test "$GITHUB_REF_NAME" = "experiment/gaminglogoai-post-body-c" || test "$GITHUB_REF_NAME" = "experiment/gaminglogoai-post-body-c-generated-runtime"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git status --porcelain)" = ""

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve candidate lockfile
        run: npm install --package-lock-only --ignore-scripts --save-exact --no-audit --no-fund

      - name: Install pinned dependencies
        run: npm ci --include=dev

      - name: Generate pinned Prisma client
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Validate disposable database target
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          for (const name of ["DATABASE_URL", "GAMING_DB_SERVICE_TEST_DATABASE_URL"]) {
            const value = process.env[name];
            if (!value) throw new Error(`${name} is missing`);
            const url = new URL(value);
            if (url.protocol !== "postgresql:" || url.hostname !== "127.0.0.1" ||
                url.port !== "5432" || url.pathname !== "/gaminglogoai_ci" ||
                url.search || url.hash) {
              throw new Error(`${name} is not the dedicated localhost database`);
            }
          }
          NODE
          migration_count="$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d | wc -l)"
          test "$migration_count" = "25"

      - name: Apply only the pinned local migration history
        run: npx prisma migrate deploy --schema prisma/schema.prisma

      - name: Install Worker postgres dependency without manifest changes
        working-directory: workers/db
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund

      - name: Install application integration-test postgres dependency
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund postgres@3.4.7

      - name: Entrypoint and session tests
        run: >-
          node --experimental-strip-types --test --test-concurrency=1
          src/server/__tests__/requestAuth.test.ts
          src/server/__tests__/requestDbService.test.ts
          src/server/__tests__/authOptionsFactory.test.ts
          workers/db/src/auth.remote.integration.test.ts

      - name: Existing auth and DB PostgreSQL integration tests
        run: >-
          node --experimental-strip-types --test --test-concurrency=1
          src/server/__tests__/dbService.integration.test.ts
          src/server/__tests__/dbService.remote.test.ts
          workers/db/src/index.test.ts
          workers/db/src/remote.integration.test.ts

      - name: Generation ledger and orchestration integration tests
        run: >-
          node --experimental-strip-types --test --test-concurrency=1
          src/server/__tests__/generation.test.ts
          workers/db/src/generation.remote.integration.test.ts

      - name: Protected generation procedure integration tests
        env:
          AUTH_EXTERNAL_SYNC_MODE: disabled
        run: >-
          node --experimental-strip-types
          --experimental-loader ./scripts/resolve-src-alias-loader.mjs
          --test --test-concurrency=1
          src/server/__tests__/generate.procedure.integration.test.ts

      - name: Node Sharp rendering regression
        run: >-
          node --experimental-strip-types
          --experimental-loader ./scripts/resolve-src-alias-loader.mjs
          --test --test-concurrency=1
          src/server/__tests__/imageWatermark.render.test.ts

      - name: Node executor package tests
        run: >-
          node --experimental-strip-types
          --test scripts/generation-executor-package.test.mjs
          workers/generation-executor/test/handler.test.ts
          workers/generation-executor/test/output-prefix.test.ts
          workers/db/src/generation.prefix.test.ts
          workers/generation-executor-gateway/src/index.sigv4.test.mjs
          workers/generation-executor-gateway/src/index.sigv4.sdk.test.mjs

      - name: Credit transaction regression
        run: >-
          node --experimental-strip-types
          --experimental-loader ./scripts/resolve-src-alias-loader.mjs
          src/server/lib/__tests__/creditTransaction.test.ts

      - name: Build self-contained Linux Lambda executor fixture
        id: lambda-package
        run: node scripts/build-generation-executor.mjs

      - name: Build deployable staging Lambda candidate
        id: deployable-lambda-package
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: node scripts/build-generation-executor-deployable.mjs

      - name: Preserve deployable staging Lambda candidate
        if: steps.deployable-lambda-package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gaminglogoai-generation-staging-deployable-${{ github.sha }}
          path: |
            .codex-tmp-tests/gaminglogoai-generation-staging-deployable-${{ github.sha }}.zip
            .codex-tmp-tests/generation-executor-staging-deployable-${{ github.sha }}/build-provenance.json
          if-no-files-found: error
          retention-days: 14

      - name: Preserve non-deployable Lambda review package
        if: steps.lambda-package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gaminglogoai-lambda-review-fixture-${{ github.sha }}
          path: .codex-tmp-tests/gaminglogoai-generation-executor-lambda-fixture-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 14

      - name: Start pinned DynamoDB Local
        shell: bash
        env:
          DYNAMODB_LOCAL_IMAGE: amazon/dynamodb-local:2.6.1
        run: |
          set -euo pipefail
          volume_name='gaminglogoai-dynamodb-local-data'
          docker pull "$DYNAMODB_LOCAL_IMAGE"
          docker volume create "$volume_name" >/dev/null
          docker run --rm --user 0:0 --entrypoint /bin/sh \
            --volume "$volume_name:/home/dynamodblocal/data" \
            "$DYNAMODB_LOCAL_IMAGE" \
            -c 'chown -R 1000:1000 /home/dynamodblocal/data'
          docker run --detach --name gaminglogoai-dynamodb-local \
            --publish 8000:8000 \
            --volume "$volume_name:/home/dynamodblocal/data" \
            --workdir /home/dynamodblocal \
            "$DYNAMODB_LOCAL_IMAGE" \
            -jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data
          docker image inspect "$DYNAMODB_LOCAL_IMAGE" --format 'DynamoDB Local image: {{index .RepoTags 0}}'
          docker volume inspect "$volume_name" --format 'DynamoDB Local volume: name={{.Name}} driver={{.Driver}}'
          docker inspect gaminglogoai-dynamodb-local --format 'DynamoDB Local container: status={{.State.Status}} running={{.State.Running}}'
          docker inspect gaminglogoai-dynamodb-local --format '{{range .Mounts}}{{.Destination}} rw={{.RW}}{{"\\n"}}{{end}}'
          docker exec gaminglogoai-dynamodb-local sh -c 'id; printf "mount-user="; id -u; printf ":"; id -g; stat -c "mount=%n owner=%u:%g mode=%A" /home/dynamodblocal/data; touch /home/dynamodblocal/data/.ci-write-check; rm /home/dynamodblocal/data/.ci-write-check'
          echo "DynamoDB Local name resolution:"
          getent ahostsv4 localhost || true
          getent ahostsv6 localhost || true
          getent ahostsv4 127.0.0.1 || true
          getent ahostsv6 127.0.0.1 || true
          last_status='unavailable'
          for attempt in $(seq 1 300); do
            status_code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 2 -X POST 'http://localhost:8000/' || true)"
            if [ "$status_code" != '000' ]; then
              echo "DynamoDB Local loopback HTTP ready (unsigned probe status: $status_code)"
              exit 0
            fi
            last_status='loopback-http-unavailable'
            sleep 1
          done
          echo "DynamoDB Local readiness result: $last_status"
          docker logs gaminglogoai-dynamodb-local
          exit 1

      - name: Compare signed DynamoDB Local clients
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: fakeMyKeyId
          AWS_SECRET_ACCESS_KEY: fakeSecretAccessKey
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set +e
          cli_error_file="$RUNNER_TEMP/gaminglogoai-dynamodb-cli-error.txt"
          if command -v aws >/dev/null 2>&1; then
            aws dynamodb list-tables \
              --endpoint-url http://localhost:8000/ \
              --region us-east-1 \
              --no-cli-pager \
              --output json >/dev/null 2>"$cli_error_file"
            cli_exit=$?
          else
            cli_exit=127
            printf 'aws-cli-missing\n' >"$cli_error_file"
          fi
          cli_error_code="$(grep -Eo '[A-Za-z][A-Za-z0-9]+Exception' "$cli_error_file" | head -n 1 || true)"
          cli_phase='unknown'
          if grep -Eqi 'timed out|timeout|socket' "$cli_error_file"; then cli_phase='socket'; fi
          if grep -Eqi 'connection refused|name or service not known|could not resolve' "$cli_error_file"; then cli_phase='connect'; fi
          if [ "$cli_exit" -eq 0 ]; then cli_phase='response'; fi
          echo "AWS CLI ListTables: exit=$cli_exit error_code=${cli_error_code:-none} phase=$cli_phase"
          for endpoint_host in localhost 127.0.0.1; do
            http_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 2 -X POST "http://$endpoint_host:8000/" || true)"
            echo "Unsigned HTTP probe host=$endpoint_host status=$http_status"
          done
          node --input-type=module -e '
            import { DynamoDBClient, ListTablesCommand } from "@aws-sdk/client-dynamodb";
            import { NodeHttpHandler } from "@smithy/node-http-handler";
            const client = new DynamoDBClient({
              endpoint: "http://localhost:8000/",
              region: "us-east-1",
              credentials: { accessKeyId: "fakeMyKeyId", secretAccessKey: "fakeSecretAccessKey" },
              maxAttempts: 1,
              requestHandler: new NodeHttpHandler({ connectionTimeout: 1500, socketTimeout: 1500 }),
            });
            const record = (value) => value && typeof value === "object" ? value : {};
            try {
              await client.send(new ListTablesCommand({}));
              console.log(JSON.stringify({ result: "pass", phase: "response" }));
            } catch (error) {
              const item = record(error);
              const meta = record(item.$metadata);
              const cause = record(item.cause);
              const name = typeof item.name === "string" ? item.name : null;
              const code = typeof item.code === "string" ? item.code : null;
              const causeCode = typeof cause.code === "string" ? cause.code : null;
              const httpStatus = typeof meta.httpStatusCode === "number" ? meta.httpStatusCode : null;
              const phase = causeCode === "ECONNREFUSED" || causeCode === "ENOTFOUND" ? "connect" : name === "TimeoutError" || causeCode === "ETIMEDOUT" ? "socket" : httpStatus !== null ? "response" : "unknown";
              console.log(JSON.stringify({ result: "fail", name, code, httpStatus, causeCode, phase }));
              process.exitCode = 1;
            } finally { client.destroy(); }
          '
          sdk_exit=$?
          if [ "$sdk_exit" -ne 0 ]; then
            echo "Signed AWS SDK readiness failed; refusing to run store assertions."
            exit "$sdk_exit"
          fi
          exit 0

      - name: DynamoExecutionStore DynamoDB Local integration tests
        env:
          DYNAMODB_LOCAL_ENDPOINT: http://localhost:8000/
        run: |
          set +e
          node --experimental-strip-types --test --test-concurrency=1 workers/generation-executor/test/dynamo-local.integration.test.ts
          test_exit=$?
          if [ "$test_exit" -ne 0 ]; then
            docker inspect gaminglogoai-dynamodb-local --format 'DynamoDB Local failure state: status={{.State.Status}} running={{.State.Running}}'
            docker logs --tail 100 gaminglogoai-dynamodb-local
          fi
          exit "$test_exit"

      - name: Runtime harness and artifact fixture tests
        run: >-
          node --test
          scripts/workers-runtime-smoke.test.mjs
          scripts/package-staging-fixture.test.mjs
          scripts/package-staging-auth.test.mjs
          workers/staging-auth/profile.test.mjs

      - name: Application typecheck
        run: npx tsc --noEmit --allowImportingTsExtensions

      - name: DB Worker typecheck
        run: npx tsc --project workers/db/tsconfig.json

      - name: Focused lint
        run: >-
          npx eslint
          --parser-options '{"project":["tsconfig.json","workers/db/tsconfig.json"]}'
          src/env.mjs
          src/pages/api/auth/[...nextauth].ts
          src/pages/api/trpc/[trpc].ts
          src/pages/api/cpa/unlock.ts
          src/pages/api/cpa/cpx/unlock.ts
          src/pages/api/cpa/cpx/result.ts
          src/server/generation/contract.ts
          src/server/generation/sqlService.ts
          src/server/generation/dbService.ts
          src/server/generation/requestService.ts
          src/server/generation/runLogo.ts
          src/server/__tests__/generation.test.ts
          src/server/__tests__/generate.procedure.integration.test.ts
          workers/db/src/generation.remote.integration.test.ts
          src/server/auth.ts
          src/server/authRuntime.ts
          src/server/requestAuth.ts
          src/server/requestDbService.ts
          src/server/watermarkPolicy.ts
          src/server/authDbService.ts
          src/server/authOptionsFactory.ts
          src/server/remoteNextAuthAdapter.ts
          src/server/api/trpc.ts
          src/server/api/readRoot.ts
          src/server/api/routers/user.ts
          src/server/__tests__/requestAuth.test.ts
          src/server/__tests__/requestDbService.test.ts
          src/server/__tests__/authOptionsFactory.test.ts
          workers/db/src/index.ts
          workers/db/src/auth.ts
          workers/db/src/auth.remote.integration.test.ts

      - name: Next.js production build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify conditional worker dependency traces
        run: |
          node --test scripts/check-worker-dependency-traces.test.mjs
          node scripts/check-worker-dependency-traces.mjs

      - name: Build OpenNext Cloudflare application
        id: opennext-build
        run: npx opennextjs-cloudflare build --dangerouslyUseUnsupportedNextVersion
        env:
          NODE_ENV: production
          DB_AUTH_BACKEND: service
          DB_READS_BACKEND: service
          CLOUDFLARE_READ_ONLY_MODE: "true"
          AUTH_EXTERNAL_SYNC_MODE: disabled
          NEXTAUTH_URL: https://gaminglogoai-cloudflare-staging.hdnstudio.workers.dev
          HOST_NAME: https://gaminglogoai-cloudflare-staging.hdnstudio.workers.dev

      - name: Verify OpenNext bundle layout
        shell: bash
        run: |
          test -s .open-next/worker.js
          test -d .open-next/assets
          test -d .open-next/server-functions
          echo "OpenNext/Cloudflare application packaging: VERIFIED"

      - name: Root Worker Wrangler dry-run
        id: root-dry-run
        run: npx wrangler@4.148.0 deploy --config wrangler.jsonc --dry-run --outdir .ci-runtime/bundle

      - name: DB Worker Wrangler dry-run
        run: npx wrangler@4.148.0 deploy --config workers/db/wrangler.jsonc --dry-run

      - name: Local Workers runtime startup and auth smoke test
        id: runtime-smoke
        timeout-minutes: 5
        run: node scripts/workers-runtime-smoke.mjs

      - name: Prepare fixture artifact provenance and content hashes
        id: fixture-package
        # Fixture publication is intentionally limited to the dedicated
        # staging branch. Experimental branches still run all validation, but
        # must not fail merely because publication is closed there.
        if: always() && github.ref_name == 'staging/gaminglogoai-auth-entrypoint-bea0' && steps.opennext-build.outcome == 'success' && steps.root-dry-run.outcome == 'success'
        run: node scripts/package-staging-fixture.mjs

      - name: Preserve fixture-only OpenNext artifact
        if: always() && steps.fixture-package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gaminglogoai-open-next-staging-fixture-${{ github.sha }}
          path: .open-next/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Preserve read-only bundle for auth candidate packaging
        if: steps.fixture-package.outcome == 'success'
        shell: bash
        run: cp -a .open-next .ci-readonly-open-next

      - name: Build separate generation HTTP fixture bundle
        if: steps.fixture-package.outcome == 'success'
        run: |
          rm -rf .next .open-next .ci-generation-open-next .ci-generation-runtime
          npm run build
          npx opennextjs-cloudflare build --dangerouslyUseUnsupportedNextVersion
          mv .open-next .ci-generation-open-next
        env:
          NODE_ENV: production
          DB_AUTH_BACKEND: service
          DB_READS_BACKEND: service
          DB_GENERATION_BACKEND: service
          GENERATION_EXECUTION_BACKEND: service
          CLOUDFLARE_READ_ONLY_MODE: "false"
          AUTH_EXTERNAL_SYNC_MODE: disabled
          NEXTAUTH_URL: https://gaminglogoai-generation.fixture.invalid
          HOST_NAME: https://gaminglogoai-generation.fixture.invalid

      - name: Generation fixture Wrangler dry-run
        if: steps.fixture-package.outcome == 'success'
        shell: bash
        run: |
          cp -a .ci-generation-open-next .open-next
          npx wrangler@4.148.0 deploy --config wrangler.gaminglogoai-generation-fixture.jsonc --dry-run --outdir .ci-generation-runtime/bundle
          test -s .ci-generation-runtime/bundle/worker.js
          if [ ! -d .ci-generation-runtime/bundle/assets ]; then cp -a .ci-generation-open-next/assets .ci-generation-runtime/bundle/assets; fi
          rm -rf .open-next

      - name: Compiled OpenNext HTTP generation probe
        if: steps.fixture-package.outcome == 'success'
        timeout-minutes: 5
        env:
          GENERATION_HTTP_PROJECT_ROOT: ${{ github.workspace }}
          GENERATION_HTTP_FIXTURE_ROOT: ${{ github.workspace }}/.ci-generation-runtime/bundle
          GENERATION_HTTP_REPORT_ROOT: ${{ github.workspace }}/.ci-generation-runtime
          GENERATION_HTTP_TOOL_BUNDLE: "true"
        run: node scripts/generation-http-runtime-smoke.mjs

      - name: Package fixture-only generation bundle
        if: steps.fixture-package.outcome == 'success'
        shell: bash
        run: |
          cp -a .ci-generation-open-next .ci-generation-artifact
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = '.ci-generation-artifact';
          const report = JSON.parse(fs.readFileSync('.ci-generation-runtime/runtime-smoke-report.json', 'utf8'));
          if (report.result !== 'GAMINGLOGOAI_GENERATION_HTTP_PROBE_PASS' || report.fixtureOnly !== true || report.deployable !== false) throw new Error('Generation fixture report is not a passing non-deployable fixture');
          const provenance = {
            schemaVersion: 1,
            purpose: 'compiled-generation-http-runtime-fixture',
            fixtureOnly: true,
            deployable: false,
            applicationSha: process.env.GITHUB_SHA,
            workflowSha: process.env.GITHUB_SHA,
            ciRunId: process.env.GITHUB_RUN_ID,
            runtimeSmokeResult: report.result,
            workerdVersion: report.workerdVersion,
            miniflareVersion: report.miniflareVersion,
            runtimeCompatibilityDate: report.runtimeCompatibilityDate,
          };
          fs.writeFileSync(path.join(root, 'build-provenance.json'), `${JSON.stringify(provenance, null, 2)}\n`, 'utf8');
          fs.copyFileSync('.ci-generation-runtime/runtime-smoke-report.json', path.join(root, 'runtime-smoke-report.json'));
          NODE

      - name: Preserve fixture-only generation bundle
        if: steps.fixture-package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gaminglogoai-open-next-generation-http-fixture-${{ github.sha }}
          path: .ci-generation-artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Restore read-only bundle for auth candidate packaging
        if: steps.fixture-package.outcome == 'success'
        shell: bash
        run: mv .ci-readonly-open-next .open-next

      - name: Prepare the auth-only staging candidate
        if: github.ref_name == 'staging/gaminglogoai-auth-entrypoint-bea0'
        run: node scripts/package-staging-auth.mjs prepare

      - name: Auth-only Worker Wrangler dry-run
        if: github.ref_name == 'staging/gaminglogoai-auth-entrypoint-bea0'
        run: npx wrangler@4.148.0 deploy --config wrangler.auth-staging.jsonc --dry-run --outdir .ci-auth-runtime/bundle

      - name: Actual workerd Google OAuth fixture round trip
        if: github.ref_name == 'staging/gaminglogoai-auth-entrypoint-bea0'
        timeout-minutes: 5
        run: node scripts/staging-auth-runtime-smoke.mjs

      - name: Verify auth candidate provenance and complete content manifest
        if: github.ref_name == 'staging/gaminglogoai-auth-entrypoint-bea0'
        run: node scripts/package-staging-auth.mjs finalize

      - name: Preserve the auth-only staging candidate
        if: github.ref_name == 'staging/gaminglogoai-auth-entrypoint-bea0'
        uses: actions/upload-artifact@v4
        with:
          name: gaminglogoai-staging-google-auth-candidate-${{ github.sha }}
          path: .staging-auth/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Diff check
        run: git diff --check



  compatibility-experiment:
    if: github.ref_name == 'experiment/gaminglogoai-post-body-c' || github.ref_name == 'experiment/gaminglogoai-post-body-c-generated-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify immutable baseline ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 0f11fb40f72cef5b0e3c13982fbebf5259a642fd "$GITHUB_SHA"

      - name: Resolve exact candidate lockfile
        shell: bash
        run: |
          set -euo pipefail
